name: Deploy Documentation to GitHub Pages

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: |
          uv sync --extra docs || uv pip install mkdocs mkdocs-material "mkdocstrings[python]" pymdown-extensions

      - name: Deploy to GitHub Pages
        run: |
          uv run mkdocs gh-deploy --force
